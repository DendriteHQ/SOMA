worker_processes auto;
events { worker_connections 2048; }
http {
    # Docker DNS is resolved per request so replacing a backend container does
    # not leave nginx pointing at its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    # Existing applications enforce their own upload limits.
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    # Discard client-provided forwarding headers. Private-route authorization
    # checks trust this ingress address and the source IP it actually observed.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;

    # The gateway pair is intentionally static and individually addressable so
    # one member can drain while the other accepts new model calls.  The zone
    # makes Docker DNS re-resolution safe across a `docker compose up --force-
    # recreate` replacement.
    upstream gateway_pool {
        zone gateway_pool 64k;
        least_conn;
        server gateway-1:8050 resolve;
        server gateway-2:8050 resolve;
    }

    # A draining gateway returns the reserved 418 status before it has read the
    # request or contacted a provider.  Retry precisely once on its peer.  This
    # avoids retrying real provider 5xx/429 responses, which might duplicate a
    # billable model call.
    map $upstream_http_x_soma_gateway_instance $gateway_drain_retry {
        gateway-1 http://gateway-2:8050;
        gateway-2 http://gateway-1:8050;
        default http://gateway_pool;
    }

    server {
        listen 8000;
        set $api http://platform-api:8000;
        set $coordinator http://run-coordinator:8000;
        set $results http://results:8000;
        location = /health/live { access_log off; return 200 '{"status":"ok"}'; }
        location /api/private/sandbox/ { proxy_pass $coordinator$request_uri; }
        location /api/private/frontend/ { proxy_pass $results$request_uri; }
        location /api/private/incentives/ { proxy_pass $results$request_uri; }
        location / { proxy_pass $api$request_uri; }
    }

    server {
        listen 8050;
        # Control routes are loopback-only on gateway containers and must never
        # be exposed through the public ingress.
        location ^~ /_internal/gateway/ { return 404; }

        location / {
            # Gateway already reads complete JSON bodies. Buffering here lets a
            # request rejected before processing be replayed to the peer.
            proxy_request_buffering on;
            proxy_intercept_errors on;
            error_page 418 = @gateway_drain_retry;
            proxy_pass http://gateway_pool;
        }

        location @gateway_drain_retry {
            internal;
            proxy_intercept_errors off;
            proxy_pass $gateway_drain_retry$request_uri;
        }
    }
}
